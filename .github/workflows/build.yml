name: build-apk

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.6'

      - name: 编译 debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: 失败时把报错写进 Summary
        if: failure()
        run: |
          echo "### 编译报错（请把本段整段复制发给助手）" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          awk '/^e: /' build.log | head -40 >> "$GITHUB_STEP_SUMMARY" || true
          awk '/\* What went wrong/{f=1} f' build.log | head -30 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: 结果摘要
        if: always()
        run: |
          echo "### 产物" >> "$GITHUB_STEP_SUMMARY"
          ls -lh app/build/outputs/apk/debug/ >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "（无产物）" >> "$GITHUB_STEP_SUMMARY"
