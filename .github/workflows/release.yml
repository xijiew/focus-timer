name: release-apk

# 打 tag（如 v2.8）时自动编译并把 APK 挂到 GitHub Release 上，
# 以后发版只需：Releases → Draft a new release → 填 tag → Publish。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.6'

      - name: 编译 debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: 失败摘要
        if: failure()
        run: |
          echo "### 编译报错" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          awk '/^e: /' build.log | head -40 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: 重命名带版本号的 APK
        run: |
          V=$(grep -m1 -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          C=$(grep -m1 -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          echo "版本 $V ($C)"
          mkdir -p out
          for f in app/build/outputs/apk/debug/*.apk; do
            cp "$f" "out/focus-timer-v${V}-c${C}-debug.apk"
          done
          ls -lh out

      - name: 挂到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          fail_on_unmatched_files: true
